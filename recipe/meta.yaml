{% set name = "backports.tempfile" %}
{% set version = "1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 1c648c452e8770d759bdc5a5e2431209be70d25484e1be24876cf2168722c762

build:
  noarch: python
  number: 1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
    - setuptools_scm
  run:
    - python >={{ python_min }}
    - backports.weakref

test:
  requires:
    - python {{ python_min }}
  imports:
    - backports.tempfile

about:
  home: https://github.com/pjdelport/backports.tempfile
  license: PSF 2
  license_file: LICENSE
  summary: "Backports of new features in Python's tempfile module"

  description: |
    This package provides backports of new features in Python’s tempfile module under the backports namespace.

extra:
  recipe-maintainers:
    - mvdbeek
